[package]
name = "dskr"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A fast file-size & disk-usage finder with a TUI (Windows/macOS/Linux)"
authors = ["QQK <QuunQuickKick@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/QuunQuickKick/dskr"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
