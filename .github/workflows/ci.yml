name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: No recursive directory deletion
        run: |
          if grep -RIn --include='*.rs' 'remove_dir_all(' src; then
            echo "src/ では remove_dir_all を使用しません" >&2
            exit 1
          fi
      - name: No network client crates
        run: |
          if cargo tree --edges normal | grep -Eiq '(^|[^a-z])(reqwest|hyper|ureq|curl|tokio|tonic|trust-dns|hickory)'; then
            echo "network-capable crate found" >&2
            exit 1
          fi
      - name: Third-party licenses 一覧が最新であること
        run: |
          bash scripts/gen-licenses.sh
          git diff --exit-code THIRD-PARTY-LICENSES.md

      - name: No network syscall imports
        run: |
          cargo build --release --locked
          if objdump -T target/release/dskr | grep -E '(^|[[:space:]])(connect|getaddrinfo|getnameinfo|sendto|recvfrom|bind|listen|accept|socket)$'; then
            echo "network syscall import found" >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  test:
    strategy:
      # 1 つの OS が失敗しても他 OS の結果を確認できるようにする
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Prepare mount fixtures (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dskr-mount"
          rm -rf "$root"
          mkdir -p "$root/parent/with_file" "$root/parent/empty_mount" \
            "$root/parent/bind_src" "$root/parent/bind_mnt"
          echo keep > "$root/parent/bind_src/keep.txt"
          sudo mount -t tmpfs tmpfs "$root/parent/with_file"
          sudo mount -t tmpfs tmpfs "$root/parent/empty_mount"
          sudo mount --bind "$root/parent/bind_src" "$root/parent/bind_mnt"
          echo keep | sudo tee "$root/parent/with_file/keep.txt" >/dev/null
          echo "DSKR_MOUNT_TEST_ROOT=$root" >> "$GITHUB_ENV"
      - name: Verify mount fixtures (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          test -n "${DSKR_MOUNT_TEST_ROOT:-}"
          mountpoint -q "$DSKR_MOUNT_TEST_ROOT/parent/with_file"
          mountpoint -q "$DSKR_MOUNT_TEST_ROOT/parent/empty_mount"
          mountpoint -q "$DSKR_MOUNT_TEST_ROOT/parent/bind_mnt"
      - run: cargo test --locked
      - name: Cleanup mount fixtures (Linux)
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dskr-mount"
          if [ -d "$root" ]; then
            sudo umount "$root/parent/with_file" 2>/dev/null || true
            sudo umount "$root/parent/empty_mount" 2>/dev/null || true
            sudo umount "$root/parent/bind_mnt" 2>/dev/null || true
            rm -rf "$root"
          fi

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-unknown-linux-musl
      - name: パッケージ作成ツールを導入
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm cpio
      - name: Third-party licenses 一覧が最新であること
        run: |
          bash scripts/gen-licenses.sh
          git diff --exit-code THIRD-PARTY-LICENSES.md
      - name: Linux パッケージを作成
        run: bash scripts/build-linux.sh --all
      - name: Linux パッケージを検証
        run: bash scripts/verify-linux-packages.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: dskr-linux
          path: dist/*

  macos-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: macOS パッケージを作成
        run: bash scripts/build-macos.sh --universal
      - name: macOS パッケージを検証
        run: bash scripts/verify-macos-packages.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: dskr-macos
          path: dist/*

  windows-unc-error-handling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: UNC error handling (nonexistent share)
        run: cargo run --release --locked -- "\\localhost\nosuchshare" --no-tui --top 5 ; if ($LASTEXITCODE -eq 0) { exit 1 } else { exit 0 }

  windows-unc-smoke:
    runs-on: windows-latest
    # GitHub ホストランナーの管理者共有は環境依存のため、必須テストとは分離する。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: UNC smoke test (local admin share)
        run: cargo run --release --locked -- "\\localhost\C$\Users" --no-tui --top 5

  windows-build-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build with build-windows.ps1 (Windows PowerShell 5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Zip
      - name: Verify zip contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path dist)) { throw 'dist が見つかりません' }
          $zip = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'zip が見つかりません' }

          $dest = Join-Path $env:RUNNER_TEMP 'dskr-zip-check'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip.FullName -DestinationPath $dest

          $top = @(Get-ChildItem -Path $dest)
          if ($top.Count -ne 1 -or -not $top[0].PSIsContainer) {
              throw 'zip 直下はパッケージフォルダ 1 つである必要があります'
          }

          $packageDir = $top[0].FullName
          $expected = @('dskr.exe', 'README.md', 'USAGE.md', 'ACCURACY.md', 'LICENSE', 'LICENSE-RUST-MIT', 'LICENSE-RUST-APACHE', 'THIRD-PARTY-LICENSES.md', 'SHA256SUMS.txt') | Sort-Object
          $actual = @(Get-ChildItem -Path $packageDir | Select-Object -ExpandProperty Name) | Sort-Object
          $diff = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($diff) {
              throw ('zip の内容が想定と違います: ' + (($diff | ForEach-Object { $_.InputObject }) -join ', '))
          }

          $sums = @(Get-Content (Join-Path $packageDir 'SHA256SUMS.txt'))
          $expectedHash = ($sums[0] -split '\s+')[0]
          $actualHash = (Get-FileHash (Join-Path $packageDir 'dskr.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) {
              throw 'SHA256SUMS.txt のハッシュが dskr.exe と一致しません'
          }

          $zipHashFile = $zip.FullName + '.sha256'
          if (-not (Test-Path $zipHashFile)) { throw 'zip の .sha256 ファイルがありません' }
          $recorded = ((Get-Content $zipHashFile) -split '\s+')[0]
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($recorded -ne $zipHash) { throw 'zip の SHA-256 が一致しません' }
      - uses: actions/upload-artifact@v7
        with:
          name: dskr-windows
          path: dist/*
