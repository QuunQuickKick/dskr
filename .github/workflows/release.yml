name: Release

# vX.Y.Z タグを push すると、Linux (tar.gz / .deb / .rpm) と
# Windows (zip) を作成し、両方が成功した場合だけ GitHub Release に添付します。
# テスト (cargo test) は ci.yml が 3 OS で実施するため、ここでは省略します。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup target add x86_64-unknown-linux-musl

      - name: パッケージ作成ツールを導入
        run: sudo apt-get update && sudo apt-get install -y musl-tools rpm cpio

      - name: タグと Cargo.toml のバージョン整合チェック
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ "$tag" != "$version" ]; then
            echo "タグ ($tag) と Cargo.toml のバージョン ($version) が一致しません" >&2
            exit 1
          fi
          echo "バージョン整合 OK: $GITHUB_REF_NAME"

      - name: 第三者ライセンス一覧の生成
        run: |
          bash scripts/gen-licenses.sh
          git diff --exit-code THIRD-PARTY-LICENSES.md

      - name: Linux パッケージを作成
        run: bash scripts/build-linux.sh --all

      - name: Linux パッケージを検証
        run: bash scripts/verify-linux-packages.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: dskr-linux
          path: dist/*

  macos-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: タグと Cargo.toml のバージョン整合チェック
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ "$tag" != "$version" ]; then
            echo "タグ ($tag) と Cargo.toml のバージョン ($version) が一致しません" >&2
            exit 1
          fi
          echo "バージョン整合 OK: $GITHUB_REF_NAME"

      - name: macOS パッケージを作成
        run: bash scripts/build-macos.sh --universal

      - name: macOS パッケージを検証
        run: bash scripts/verify-macos-packages.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: dskr-macos
          path: dist/*

  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: 第三者ライセンス一覧の生成
        shell: bash
        run: bash scripts/gen-licenses.sh

      - name: タグと Cargo.toml のバージョン整合チェック
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "タグ名は vX.Y.Z 形式で指定してください: $tag"
          }
          $version = ''
          foreach ($line in Get-Content -Path Cargo.toml) {
            if ($line -match '^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
          if ($tag -ne "v$version") {
            throw "タグ ($tag) と Cargo.toml のバージョン (v$version) が一致しません"
          }
          Write-Host "バージョン整合 OK: $tag"

      - name: ビルドと zip 作成
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-windows.ps1 -Zip

      - name: 成果物の検証
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zip = Join-Path 'dist' ("dskr-$version-windows-x86_64.zip")
          if (-not (Test-Path $zip)) { throw "zip が見つかりません: $zip" }
          $hashFile = "$zip.sha256"
          if (-not (Test-Path $hashFile)) { throw "SHA-256 ファイルが見つかりません: $hashFile" }
          $expected = ((Get-Content $hashFile -First 1) -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'zip の SHA-256 が一致しません' }

          # zip 直下はバージョン付きフォルダ 1 つで、同梱物は 9 ファイル
          $dest = Join-Path $env:RUNNER_TEMP 'release-zip-check'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dest
          $top = @(Get-ChildItem $dest)
          if ($top.Count -ne 1 -or -not $top[0].PSIsContainer) {
            throw 'zip 直下はパッケージフォルダ 1 つである必要があります'
          }
          $expectedFiles = @('dskr.exe', 'README.md', 'USAGE.md', 'ACCURACY.md', 'LICENSE', 'LICENSE-RUST-MIT', 'LICENSE-RUST-APACHE', 'THIRD-PARTY-LICENSES.md', 'SHA256SUMS.txt') | Sort-Object
          $actualFiles = @(Get-ChildItem $top[0].FullName | Select-Object -ExpandProperty Name) | Sort-Object
          $diff = Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $actualFiles
          if ($diff) {
            throw ('zip の内容が不正です: ' + (($diff | ForEach-Object { $_.InputObject }) -join ', '))
          }
          Write-Host "検証 OK: $zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dskr-windows
          path: dist/*

  publish:
    needs: [linux-packages, macos-packages, windows-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release を作成して成果物を添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            echo "既存リリースに成果物を追加しました: $tag"
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*
            echo "リリースを作成しました: $tag"
          fi
